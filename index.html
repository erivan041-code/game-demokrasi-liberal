<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petualangan Sejarah & Kuliner Tanjabtim</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
        }
        .font-game {
            font-family: 'Fredoka One', cursive;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-glow {
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
        }
        .btn-glow:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.7);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #f59e0b;
        }
    </style>
</head>
<body class="p-2 sm:p-6 flex justify-center items-center">

    <div id="app" class="w-full max-w-4xl glass-card rounded-2xl shadow-2xl overflow-hidden min-h-[600px] flex flex-col justify-between p-4 sm:p-8 relative">

        <!-- HEADER SECTION -->
        <header class="flex justify-between items-center border-b border-slate-700 pb-4 mb-4">
            <div class="flex items-center gap-3">
                <div class="bg-amber-500 text-slate-900 p-2.5 rounded-xl text-2xl font-bold">
                    <i class="fa-solid fa-utensils"></i>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold text-amber-400 font-game tracking-wide">Jelajah Tanjabtim & Sejarah</h1>
                    <p class="text-xs sm:text-sm text-slate-400">Demokrasi Liberal (1950–1959) - Kelas XII</p>
                </div>
            </div>
            <!-- Score & Progress Display -->
            <div class="flex items-center gap-4">
                <div class="text-right">
                    <span class="text-xs text-slate-400 block">Skor Kamu</span>
                    <span id="score-display" class="text-xl font-bold text-emerald-400 font-game">0</span>
                </div>
                <div class="text-right">
                    <span class="text-xs text-slate-400 block">Kuliner Terbuka</span>
                    <span id="dish-display" class="text-xl font-bold text-amber-400 font-game">0/5</span>
                </div>
            </div>
        </header>

        <!-- MAIN GAME DISPLAY AREA -->
        <main id="main-content" class="flex-grow flex flex-col justify-center my-4">
            <!-- Dynamic Content Injected Here via JS -->
        </main>

        <!-- FOOTER & CONTROLS -->
        <footer class="border-t border-slate-700 pt-4 flex justify-between items-center text-xs text-slate-400">
            <div>
                <span><i class="fa-solid fa-location-dot text-red-500"></i> Kab. Tanjung Jabung Timur, Jambi</span>
            </div>
            <button id="reset-btn" onclick="restartGame()" class="hover:text-amber-400 transition text-slate-400 flex items-center gap-1">
                <i class="fa-solid fa-rotate-right"></i> Ulangi Game
            </button>
        </footer>

        <!-- MODAL FOR MESSAGES / NOTIFICATIONS -->
        <div id="modal-overlay" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="glass-card bg-slate-900 border border-amber-500/30 p-6 rounded-2xl max-w-md w-full text-center relative animate-bounce-short">
                <div id="modal-icon" class="text-5xl mb-3"></div>
                <h3 id="modal-title" class="text-xl font-bold text-amber-400 mb-2 font-game"></h3>
                <p id="modal-body" class="text-slate-300 text-sm mb-6 leading-relaxed"></p>
                <button onclick="closeModal()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-2.5 rounded-xl transition">Lanjutkan</button>
            </div>
        </div>

    </div>

    <script>
        // Data Game: 5 Level yang menggabungkan Sejarah Demokrasi Liberal & Kuliner Tanjung Jabung Timur
        const gameData = [
            {
                level: 1,
                kabinet: "Kabinet Natsir (1950-1951)",
                culinary: {
                    name: "Ikan Sembilang Salai",
                    origin: "Kecamatan Nipah Panjang / Sadu",
                    desc: "Ikan Sembilang segar khas perairan muara Tanjabtim yang dikeringkan dengan pengasapan tradisional.",
                    img: "🐟🔥",
                    fact: "Sama seperti Ikan Sembilang Salai yang awet melalui pengasapan, Kabinet Natsir menginisiasi 'Program Benteng' untuk memperkuat pengusaha pribumi agar bisa bertahan di tengah persaingan ekonomi!"
                },
                question: "Apa tujuan utama dari 'Sistem Ekonomi Benteng' yang dicetuskan pada masa Kabinet Natsir?",
                options: [
                    "Membina dan membantu pengusaha pribumi agar mampu bersaing dengan pengusaha asing.",
                    "Penyederhanaan nilai mata uang rupiah (Gunting Syafruddin).",
                    "Membuat perundingan damai dengan gerakan DI/TII Jawa Barat.",
                    "Nasionalisasi seluruh perusahaan tambang minyak Belanda."
                ],
                correct: 0,
                explanation: "Sistem Ekonomi Benteng digagas oleh Sumitro Djojohadikusumo (Menteri Perdagangan masa Natsir) untuk mengubah struktur ekonomi kolonial menjadi nasional dengan memprioritaskan pengusaha pribumi."
            },
            {
                level: 2,
                kabinet: "Kabinet Sukiman (1951-1952)",
                culinary: {
                    name: "Gulai Terjun Tanjabtim",
                    origin: "Kecamatan Rantau Rasau",
                    desc: "Gulai khas berbasis santan encer dengan rempah pedas gurih, dipadukan daging sapi/kambing atau umbut kelapa.",
                    img: "🍲🌶️",
                    fact: "Cita rasa Gulai Terjun yang sangat kuat dan resepnya yang tegas mirip politik luar negeri Indonesia. Namun Kabinet Sukiman terjatuh akibat dinilai melanggar Politik Bebas-Aktif!"
                },
                question: "Mengapa Kabinet Sukiman mengalami jatuhnya mosi tidak percaya dan harus mengembalikan mandatnya?",
                options: [
                    "Kegagalan menyelenggarakan Pemilihan Umum pertama.",
                    "Menandatangani kerja sama bantuan ekonomi & militer (MSA) dengan Amerika Serikat.",
                    "Terjadinya peristiwa perselisihan AD tanggal 17 Oktober 1952.",
                    "Adanya masalah pembatalan hasil Konferensi Meja Bundar (KMB)."
                ],
                correct: 1,
                explanation: "Penandatanganan Mutual Security Act (MSA) dengan AS dianggap menyimpang dari prinsip politik luar negeri Indonesia yang bebas dan aktif, sehingga menanti kecaman hebat di parlemen."
            },
            {
                level: 3,
                kabinet: "Kabinet Ali Sastroamidjojo I (1953-1955)",
                culinary: {
                    name: "Kue Padamarun",
                    origin: "Muara Sabak & Mendahara",
                    desc: "Kue basah tradisional berbahan tepung beras, santan, dan gula merah yang dikukus dalam wadah takir daun pisang.",
                    img: "🍃🍮",
                    fact: "Kue Padamarun membutuhkan kekompakan adonan yang pas. Sebagaimana prestasinya, Kabinet Ali I berhasil menyatukan negara-negara Asia-Afrika dalam KAA 1955!"
                },
                question: "Prestasi internasional terbesar yang dicapai oleh Kabinet Ali Sastroamidjojo I adalah...",
                options: [
                    "Merebut kembali Irian Barat dari penguasaan Kerajaan Belanda.",
                    "Penyelenggaraan Konferensi Asia-Afrika (KAA) di Bandung tahun 1955.",
                    "Mencapai kesepakatan penataan batas maritim dengan Malaysia.",
                    "Membentuk Dewan Perancang Nasional (Depernas)."
                ],
                correct: 1,
                explanation: "Kabinet Ali I sukses menggelar KAA 1955 di Bandung yang menjadi cikal bakal Gerakan Non-Blok dan meningkatkan kredibilitas Indonesia di tingkat internasional."
            },
            {
                level: 4,
                kabinet: "Kabinet Burhanuddin Harahap (1955-1956)",
                culinary: {
                    name: "Nasi Gemuk Tanjabtim",
                    origin: "Seluruh Wilayah Tanjung Jabung Timur",
                    desc: "Nasi gurih beraroma rempah khas Jambi, disajikan dengan telur, teri, kacang goreng, dan sambal khas.",
                    img: "🍚🍳",
                    fact: "Nasi Gemuk menjadi sarapan favorit masyarakat saat merayakan pesta demokrasi. Kabinet Burhanuddin Harahap berhasil menyelenggarakan Pemilu Pertama dalam sejarah Indonesia!"
                },
                question: "Pemilu pertama Indonesia pada tahun 1955 diselenggarakan dalam dua tahap. Tahap pertama (29 September 1955) bertujuan untuk memilih...",
                options: [
                    "Presiden dan Wakil Presiden secara langsung.",
                    "Anggota Dewan Perwakilan Rakyat (DPR).",
                    "Anggota Konstituante penyusun UUD.",
                    "Anggota Dewan Daerah / DPRD."
                ],
                correct: 1,
                explanation: "Pemilu 1955 dilakukan 2 tahap: 29 September 1955 untuk memilih anggota DPR, dan 15 Desember 1955 untuk memilih anggota Konstituante."
            },
            {
                level: 5,
                kabinet: "Kabinet Djuanda & Akhir Era (1957-1959)",
                culinary: {
                    name: "Lempuk Durian Tanjabtim",
                    origin: "Kecamatan Geragai / Sabak Barat",
                    desc: "Olahan lezat menyerupai dodol yang terbuat dari buah durian asli dan gula tanpa bahan pengawet.",
                    img: "🍫🥭",
                    fact: "Lempuk Durian menyatukan rasa durian alami menjadi satu bentuk manis. Deklarasi Djuanda 1957 berhasil menyatukan seluruh wilayah laut darat kepulauan Indonesia!"
                },
                question: "Deklarasi Djuanda yang dicetuskan tanggal 13 Desember 1957 memuat prinsip penting yaitu...",
                options: [
                    "Batas laut teritorial Indonesia diukur 12 mil laut dari garis pantai pulau terluar.",
                    "Pemotongan nilai mata uang uang kertas Rp 5,- ke atas menjadi setengahnya.",
                    "Pemberlakuan kembali UUD 1945 menggantikan UUDS 1950.",
                    "Pembubaran seluruh partai politik di Indonesia."
                ],
                correct: 0,
                explanation: "Deklarasi Djuanda mengubah konsep batas laut dari 3 mil (aturan kolonial) menjadi 12 mil laut dihitung dari garis pangkal terluar, memperluas wilayah kedaulatan laut Indonesia secara menyeluruh."
            }
        ];

        // Global State variables
        let currentLevel = 0;
        let score = 0;
        let unlockedDishes = [];

        window.onload = function() {
            showStartScreen();
        };

        function updateHeader() {
            document.getElementById('score-display').innerText = score;
            document.getElementById('dish-display').innerText = `${unlockedDishes.length}/${gameData.length}`;
        }

        // Tampilan Layar Awal (Welcome Screen)
        function showStartScreen() {
            const main = document.getElementById('main-content');
            main.innerHTML = `
                <div class="text-center py-6">
                    <div class="inline-block p-4 bg-amber-500/10 rounded-full mb-4 border border-amber-500/30">
                        <span class="text-6xl">🌴🍲📜</span>
                    </div>
                    <h2 class="text-2xl sm:text-3xl font-bold text-amber-400 mb-3 font-game">Petualangan Kuliner Tanjabtim & Sejarah Demokrasi Liberal</h2>
                    <p class="text-slate-300 max-w-xl mx-auto text-sm sm:text-base leading-relaxed mb-6">
                        Selamat datang, Calon Sejarawan & Wisatawan Kuliner! Bantu koki lokal menyajikan 
                        <span class="text-amber-400 font-semibold">5 Kuliner Khas Kabupaten Tanjung Jabung Timur</span> 
                        dengan menjawab tantangan seputar <span class="text-amber-400 font-semibold">Masa Demokrasi Liberal (1950-1959)</span>.
                    </p>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 max-w-2xl mx-auto mb-8 text-xs text-slate-400">
                        <div class="glass-card p-3 rounded-xl border border-slate-700">
                            <i class="fa-solid fa-landmark text-amber-400 text-lg mb-1"></i>
                            <p>7 Kabinet Indonesia</p>
                        </div>
                        <div class="glass-card p-3 rounded-xl border border-slate-700">
                            <i class="fa-solid fa-vote-yea text-emerald-400 text-lg mb-1"></i>
                            <p>Pemilu 1955</p>
                        </div>
                        <div class="glass-card p-3 rounded-xl border border-slate-700">
                            <i class="fa-solid fa-water text-cyan-400 text-lg mb-1"></i>
                            <p>Deklarasi Djuanda</p>
                        </div>
                        <div class="glass-card p-3 rounded-xl border border-slate-700">
                            <i class="fa-solid fa-bowl-food text-rose-400 text-lg mb-1"></i>
                            <p>Kuliner Tanjabtim</p>
                        </div>
                    </div>
                    <button onclick="startGame()" class="btn-glow bg-amber-500 text-slate-950 font-bold px-8 py-3.5 rounded-xl text-lg font-game tracking-wider">
                        MULAI PETUALANGAN <i class="fa-solid fa-arrow-right ml-2"></i>
                    </button>
                </div>
            `;
        }

        function startGame() {
            currentLevel = 0;
            score = 0;
            unlockedDishes = [];
            updateHeader();
            renderLevel();
        }

        function renderLevel() {
            const data = gameData[currentLevel];
            const main = document.getElementById('main-content');

            main.innerHTML = `
                <div class="space-y-6">
                    <!-- Progress Bar -->
                    <div>
                        <div class="flex justify-between text-xs text-slate-400 mb-1">
                            <span>Misi Level ${data.level} dari 5</span>
                            <span>Masa: ${data.kabinet}</span>
                        </div>
                        <div class="w-full bg-slate-800 rounded-full h-2.5 overflow-hidden">
                            <div class="bg-amber-500 h-2.5 rounded-full transition-all duration-500" style="width: ${(data.level / gameData.length) * 100}%"></div>
                        </div>
                    </div>

                    <!-- Target Kuliner Card -->
                    <div class="glass-card bg-amber-950/20 border-amber-500/30 p-4 rounded-xl flex items-center gap-4">
                        <div class="text-4xl sm:text-5xl bg-slate-800/80 p-3 rounded-xl border border-slate-700">${data.culinary.img}</div>
                        <div>
                            <span class="text-xs text-amber-400 font-semibold uppercase tracking-wider">Kuliner Target:</span>
                            <h3 class="text-lg font-bold text-slate-100 font-game">${data.culinary.name}</h3>
                            <p class="text-xs text-slate-400"><i class="fa-solid fa-map-pin text-rose-400"></i> ${data.culinary.origin}</p>
                        </div>
                    </div>

                    <!-- Question Box -->
                    <div class="glass-card p-5 sm:p-6 rounded-xl border border-slate-700">
                        <span class="inline-block px-3 py-1 bg-amber-500/20 text-amber-400 rounded-md text-xs font-semibold mb-3">
                            <i class="fa-solid fa-circle-question mr-1"></i> Soal Sejarah XII
                        </span>
                        <h3 class="text-base sm:text-lg font-semibold text-slate-100 mb-4">${data.question}</h3>

                        <!-- Answer Options -->
                        <div class="grid grid-cols-1 gap-3">
                            ${data.options.map((opt, idx) => `
                                <button onclick="checkAnswer(${idx})" class="text-left p-3.5 sm:p-4 rounded-xl bg-slate-800/80 hover:bg-amber-500/20 hover:border-amber-500/50 border border-slate-700/80 text-sm text-slate-200 transition flex items-start gap-3 group">
                                    <span class="w-6 h-6 rounded-lg bg-slate-700 group-hover:bg-amber-500 group-hover:text-slate-950 text-amber-400 flex justify-center items-center font-bold text-xs shrink-0">
                                        ${String.fromCharCode(65 + idx)}
                                    </span>
                                    <span class="mt-0.5">${opt}</span>
                                </button>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function checkAnswer(selectedIndex) {
            const data = gameData[currentLevel];
            
            if (selectedIndex === data.correct) {
                // Correct Answer Logic
                score += 20;
                unlockedDishes.push(data.culinary);
                updateHeader();

                showModal(
                    "🎉 Jawaban Benar! Resep Ditemukan!",
                    `
                    <div class="mb-4 text-left glass-card bg-amber-950/30 p-4 rounded-xl border border-amber-500/30">
                        <div class="flex items-center gap-3 mb-2">
                            <span class="text-3xl">${data.culinary.img}</span>
                            <div>
                                <h4 class="font-bold text-amber-400 font-game">${data.culinary.name}</h4>
                                <p class="text-xs text-slate-400">${data.culinary.origin}</p>
                            </div>
                        </div>
                        <p class="text-xs text-slate-300 italic mb-2">"${data.culinary.desc}"</p>
                        <div class="bg-slate-900/80 p-2.5 rounded-lg border border-slate-800 text-xs text-amber-300/90">
                            <strong>💡 Kaitan Sejarah & Kuliner:</strong> ${data.culinary.fact}
                        </div>
                    </div>
                    <p class="text-xs text-slate-400 text-left"><strong>Penjelasan Sejarah:</strong> ${data.explanation}</p>
                    `,
                    "✅",
                    nextLevel
                );
            } else {
                // Wrong Answer Logic
                showModal(
                    "❌ Jawaban Masih Kurang Tepat!",
                    `
                    <p class="mb-3 text-slate-300">Coba ingat kembali materi tentang <strong class="text-amber-400">${data.kabinet}</strong>!</p>
                    <p class="text-xs text-slate-400 text-left bg-slate-800 p-3 rounded-lg border border-slate-700"><strong>Petunjuk:</strong> ${data.explanation}</p>
                    `,
                    "⚠️",
                    null
                );
            }
        }

        function nextLevel() {
            currentLevel++;
            if (currentLevel < gameData.length) {
                renderLevel();
            } else {
                showVictoryScreen();
            }
        }

        function showVictoryScreen() {
            const main = document.getElementById('main-content');
            main.innerHTML = `
                <div class="text-center py-6">
                    <div class="text-6xl mb-3 animate-bounce">🏆</div>
                    <h2 class="text-2xl sm:text-3xl font-bold text-amber-400 font-game mb-2">Selamat! Petualangan Selesai!</h2>
                    <p class="text-slate-300 text-sm mb-6">Kamu telah menguasai materi Sejarah Demokrasi Liberal XII SMA & melestarikan Kuliner Khas Tanjung Jabung Timur!</p>

                    <!-- Score Card -->
                    <div class="glass-card bg-amber-500/10 border border-amber-500/30 p-4 rounded-xl max-w-md mx-auto mb-6">
                        <div class="flex justify-around items-center text-center">
                            <div>
                                <span class="text-xs text-slate-400 block">Total Skor</span>
                                <span class="text-2xl font-bold text-emerald-400 font-game">${score} / 100</span>
                            </div>
                            <div class="w-px h-10 bg-slate-700"></div>
                            <div>
                                <span class="text-xs text-slate-400 block">Resep Terkumpul</span>
                                <span class="text-2xl font-bold text-amber-400 font-game">5 Kuliner</span>
                            </div>
                        </div>
                    </div>

                    <!-- Culinary Gallery -->
                    <h3 class="text-base font-bold text-slate-200 mb-3 text-left font-game">🍽️ Koleksi Kuliner Tanjabtim Milikmu:</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6 text-left">
                        ${unlockedDishes.map(d => `
                            <div class="glass-card p-3 rounded-xl border border-slate-700/80 flex items-center gap-3">
                                <span class="text-3xl bg-slate-800 p-2 rounded-lg">${d.img}</span>
                                <div>
                                    <h4 class="font-bold text-amber-400 text-sm font-game">${d.name}</h4>
                                    <p class="text-xs text-slate-400"><i class="fa-solid fa-location-dot text-rose-400 text-[10px]"></i> ${d.origin}</p>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <button onclick="startGame()" class="btn-glow bg-amber-500 text-slate-950 font-bold px-8 py-3.5 rounded-xl text-base font-game">
                        <i class="fa-solid fa-rotate-right mr-2"></i> Main Lagi
                    </button>
                </div>
            `;
        }

        // Helper functions for modal popup
        let onModalCloseCallback = null;

        function showModal(title, bodyHtml, icon, onClose) {
            document.getElementById('modal-title').innerHTML = title;
            document.getElementById('modal-body').innerHTML = bodyHtml;
            document.getElementById('modal-icon').innerText = icon;
            document.getElementById('modal-overlay').classList.remove('hidden');
            onModalCloseCallback = onClose;
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.add('hidden');
            if (onModalCloseCallback) {
                onModalCloseCallback();
                onModalCloseCallback = null;
            }
        }

        function restartGame() {
            showStartScreen();
            score = 0;
            unlockedDishes = [];
            updateHeader();
        }
    </script>
</body>
</html>
